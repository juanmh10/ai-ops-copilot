services:
  agent-backend:
    build:
      context: ./agent-backend
      dockerfile: Dockerfile
    container_name: ai-ops-copilot-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOCAL_MOCK_MODE=true
      - GCP_PROJECT_ID=enterprise-core-prod
      - GCP_LOCATION=us-central1
      - GEMINI_MODEL=gemini-3.8-flash
      - GRAFANA_URL=http://grafana:3000
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8085
      - ALLOWED_ORIGINS=*
    depends_on:
      - firestore-emulator
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    container_name: ai-ops-copilot-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-AdminSecurePassword2026!}
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=ai-ops-copilot-chat
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=info
      - GF_PATHS_DATA=/var/lib/grafana-data
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-enterprise-core-prod}
      - BILLING_PROJECT_ID=${BILLING_PROJECT_ID:-enterprise-ai-analytics}
      - BILLING_DATASET=${BILLING_DATASET:-enterprise-ai-analytics.billing_export}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/unified-cloudrun-dashboard.json
    volumes:
      # Mount only runtime artifacts. A local dist/ directory ignored
      # by Git must not shadow the reproducible plugin bundle.
      - ./grafana-plugin/plugin.json:/var/lib/grafana/plugins/ai-ops-copilot-chat/plugin.json:ro
      - ./grafana-plugin/module.js:/var/lib/grafana/plugins/ai-ops-copilot-chat/module.js:ro
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana-data
    restart: unless-stopped

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: ai-ops-copilot-firestore
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8085 --project=enterprise-core-prod
    ports:
      - "8085:8085"
    restart: unless-stopped

volumes:
  grafana-data:
